<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D7674">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="渚時間">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>渚時間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one calm phone-width column on the shore, views swapped in place, a fixed bottom tab bar (海月時間シリーズと同じ骨組み) */
:root{
  --bg:#EEF5F2; --bg-top:#D7ECE7; --surface:#FFFFFF; --sunk:#E2EEEA; --ink:#13302F; --muted:#527170; --line:#C6DCD6;
  --teal:#1D7674; --teal-soft:#D3EBE6; --accent:#E5866A; --accent-soft:#FBE6DD; --accent-ink:#6A2A17;
  --good:#23845A; --good-bg:#DCF1E6; --bad:#B9503A; --bad-bg:#F8E1DA;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08181A; --bg-top:#0E2A2C; --surface:#0F2427; --sunk:#0B1E20; --ink:#E0F0EC; --muted:#93B2AD; --line:#1F3D3E;
  --teal:#6CC9C2; --teal-soft:#143536; --accent:#F2A08A; --accent-soft:#3A2019; --accent-ink:#F8D6CB;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08181A; --bg-top:#0E2A2C; --surface:#0F2427; --sunk:#0B1E20; --ink:#E0F0EC; --muted:#93B2AD; --line:#1F3D3E;
  --teal:#6CC9C2; --teal-soft:#143536; --accent:#F2A08A; --accent-soft:#3A2019; --accent-ink:#F8D6CB;
  --good:#6CCB94; --good-bg:#14332A; --bad:#E8826A; --bad-bg:#3A201A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg) linear-gradient(180deg,var(--bg-top) 0,var(--bg) 360px) no-repeat;min-height:100%;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:10px;min-height:52px}
.back{border:0;background:none;padding:8px 10px 8px 0;font-size:1rem;color:var(--teal);font-weight:700;white-space:nowrap;flex:none}
.top .ttl{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hello{padding-block:10px 4px}
.hello .eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--teal);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}

.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(120deg,#1D7674,#2E9A93);color:#F2FBF9;border:0;border-radius:14px;padding:16px 18px}
.continue small{display:block;opacity:.85;font-size:.8rem}
.continue strong{font-family:var(--f-display);font-size:1.1rem}
.continue .go{font-size:1.4rem;color:#FFD9C8}

.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subj{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:92px}
.subj .k{font-family:var(--f-display);font-size:1.6rem;font-weight:900;line-height:1;color:var(--teal)}
.subj b{font-family:var(--f-display);font-size:1.05rem}
.subj .small{line-height:1.45}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item[disabled]{opacity:.5;cursor:default}
.item .body{flex:1;min-width:0}
.item .chev{color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--good-bg);color:var(--good)}
.tag.mid{background:var(--accent-soft);color:var(--accent-ink)}
.lid{flex:none;min-width:44px;height:30px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal);font-weight:700;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:.9rem}
.lid.done{background:var(--teal);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--teal);color:var(--surface)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.warm{background:var(--accent);color:#2E0F05}
.btn.wide{width:100%}
.btn.again{background:var(--teal-soft);color:var(--teal);border:2px solid var(--teal)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.item:focus-visible,.subj:focus-visible,.choice:focus-visible,.card:focus-visible,.tab:focus-visible,.rflip:focus-visible,.continue:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* lesson */
.lesson section{display:flex;flex-direction:column;gap:10px}
.rule{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.75}
.fx{background:var(--sunk);border-radius:10px;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.8}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl th{font-weight:700;color:var(--muted);font-size:.8rem}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.scroll{overflow-x:auto}

/* cards */
.card{position:relative;width:100%;min-height:230px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:24px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.card .side{font-size:.75rem;letter-spacing:.1em;color:var(--teal);font-weight:700}
.card .term{font-family:var(--f-display);font-size:1.7rem;font-weight:900}
.card .def{font-size:1.02rem;line-height:1.8;max-width:30em}
.card.flipped{background:var(--teal-soft)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center}
.qbox .prompt{color:var(--muted);font-size:.92rem}
.qbox .expr{font-family:var(--f-display);font-size:1.6rem;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.5}
.qbox .expr.long{font-size:1.12rem;font-weight:700;line-height:1.7;text-align:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;font-family:var(--f-display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.choices.words{grid-template-columns:1fr}
.choices.words .choice{font-size:1.02rem;padding:12px;text-align:left}
.choice.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.choice.ng{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.choice[disabled]{cursor:default}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-bg)}
.feedback.ng{background:var(--bad-bg)}
.feedback .verdict{font-family:var(--f-display);font-weight:900;font-size:1.15rem}
.feedback.ok .verdict{color:var(--good)} .feedback.ng .verdict{color:var(--bad)}
.hint{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-size:.95rem}
.linkbtn{border:0;background:none;color:var(--teal);font-weight:700;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.result{text-align:center;padding:24px 16px}
.result .big{font-family:var(--f-display);font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--teal);line-height:1.1}

/* record */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.day.on{background:var(--teal);color:var(--surface);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=text]:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--good)}
.status.wait::before{background:var(--accent)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);font-weight:700}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tab.on{color:var(--teal)}

@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}

/* shore hero */
.shore{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#F6C7A6 0%,#9FD3D2 40%,#2C8C8E 100%);color:#fff;padding:22px 18px 34px;min-height:176px;display:flex;align-items:flex-end}
.shore .art{position:absolute;inset:0;width:100%;height:100%}
.shore .txt{position:relative;z-index:1;max-width:72%;display:flex;flex-direction:column;gap:4px;text-shadow:0 1px 3px rgba(6,40,42,.7),0 0 12px rgba(6,40,42,.5)}
.shore .name{font-family:var(--f-display);font-weight:900;font-size:1.05rem;letter-spacing:.2em;color:#FFFFFF}
.shore h1{color:#FFFFFF;font-size:1.45rem}
.shore p{color:#FFFFFF;font-size:.88rem}
@keyframes lap{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
.lap{animation:lap 5s ease-in-out infinite}

/* reward card */
.rcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 4px}
.rlead{font-family:var(--f-display);font-weight:700;color:var(--teal);text-align:center}
.rflip{border:0;padding:0;background:none;width:min(100%,300px);max-width:100%;aspect-ratio:3/4;perspective:1200px;cursor:pointer}
.rflip[disabled]{cursor:default}
.rinner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.rcard.open .rinner{transform:rotateY(180deg)}
.rback,.rfront{position:absolute;inset:0;border-radius:18px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 12px 30px rgba(6,30,32,.32)}
.rback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(120% 80% at 50% 0%,#3AA39C 0%,#16605F 55%,#082E30 100%);border:3px solid #F5C9B3;color:#FFF0E8}
.rback svg{width:56%;height:auto}
.rhint{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;font-size:.95rem;padding:6px 14px;border-radius:99px;background:rgba(245,201,179,.18)}
.rcard:not(.open) .rflip{animation:nudge 2.6s ease-in-out 1s infinite}
@keyframes nudge{0%,86%,100%{transform:none}90%{transform:rotate(-2deg)}94%{transform:rotate(2deg)}}
.rfront{transform:rotateY(180deg);background:#0B2A2C;border:3px solid #9FD8D2}
.rfront img,.rfront svg{display:block;width:100%;height:100%;object-fit:cover}
.rfront.fit{background:#0B2A2E}
.rfront.fit img{object-fit:contain}
.rcap,.viewer figcaption{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.rcap{transition:opacity .4s ease .55s}
.rcard:not(.open) .rcap{opacity:0;visibility:hidden}
.rno{font-size:.8rem;letter-spacing:.06em;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.rno em{font-style:normal;background:var(--accent);color:#2E0F05;border-radius:99px;padding:0 9px;font-size:.72rem;font-weight:700;letter-spacing:.08em}
.rname{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.rnote{font-size:.9rem;color:var(--muted)}
.rcount{font-size:.76rem;color:var(--muted);margin-top:4px}
.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.coll>*{aspect-ratio:3/4;max-width:100%;border-radius:8px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;border:0;padding:0}
.coll button{cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.coll img,.coll svg{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(3,18,20,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));color:#E0F0EC}
.viewer figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;width:100%}
.viewer img,.viewer .vsvg{max-width:100%;max-height:66vh;border-radius:14px;object-fit:contain;display:block}
.viewer .vsvg{width:min(100%,46vh)}
.viewer .vsvg svg{width:100%;height:auto;display:block;border-radius:14px}
.viewer .rno,.viewer .rnote{color:#A9C9C4}

/* tide pool */
.poolbox{border-radius:22px;overflow:hidden;background:#D9C9A8;color:#13302F}
.poolbox .tide{display:block;width:100%;height:auto}
.poolcount{display:flex;justify-content:space-between;padding:8px 16px 12px;font-size:.82rem;color:#4A3F2C}
.poolcount b{color:#13302F;font-size:1rem}
.stg{width:150px;max-width:42%;height:auto;flex:none;background:linear-gradient(180deg,#9FD3D2,#2C8C8E);border-radius:16px}
.growtop{display:flex;gap:12px;align-items:center;justify-content:space-between}
.growtop>div{min-width:0}
.grow{display:flex;flex-direction:column;gap:10px}
.wavei{width:22px;height:22px;fill:none;stroke:var(--teal);stroke-width:2.2;stroke-linecap:round;flex:none}
.wavebal{display:flex;align-items:center;gap:6px;font-weight:700}
.wavebal b{font-size:1.15rem;color:var(--teal)}
.poolmsg{margin:0;color:var(--teal);font-weight:700}
.born{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,#9FD3D2,#2C8C8E);color:#06292A;border:0}
.born h3{margin:2px 0}.born .muted{color:#174A4A}
.bsv{width:104px;height:104px;flex:none}
.zukan{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.zk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:12px;background:linear-gradient(180deg,#BFE3E0,#6DB7B4);color:#0A2E2F;min-width:0}
.zk svg{width:56px;height:56px}.zk b{font-size:.8rem}.zk span{font-size:.66rem;line-height:1.4;color:#123E3E}
.zk.no{background:var(--sunk);color:var(--muted)}
.waveget{display:flex;align-items:center;gap:10px}.waveget>div{flex:1;min-width:0}.waveget .wavei{width:30px;height:30px}

/* PDF */
.ladder{display:flex;flex-direction:column;gap:10px}
.rung{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rung .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.stage{flex:none;width:46px;height:46px;fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sname{font-family:var(--f-display);font-size:1.1rem}
.pdfbar{display:flex;gap:8px;align-items:center}
.pdfseg{display:flex;flex:1;background:var(--surface);border-radius:999px;padding:3px;border:1px solid var(--line)}
.pdfseg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:999px;font-size:.9rem}
.pdfseg button.on{background:var(--teal);color:var(--surface);font-weight:700}
.pdfzoom{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:.85rem;white-space:nowrap}
.pdfpages{display:flex;flex-direction:column;gap:12px;overflow-x:auto;min-height:200px}
.pdfpage{background:#fff;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.15);flex:none}
.pdfbtn{padding:9px 14px;font-size:.9rem}

.ul{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--accent);text-decoration-skip-ink:none}
.blank{display:inline-block;min-width:3.2em;height:1.5em;vertical-align:middle;border:2px solid var(--ink);margin:0 .2em}
.novel{display:flex;flex-direction:column;gap:.6em;font-size:1rem;line-height:2}
.novel p{text-indent:1em;margin:0}
.novel p.talk{display:grid;grid-template-columns:4.2em 1fr;gap:.3em;text-indent:0}
.novel p.talk b{color:var(--teal);white-space:nowrap}
.novel .doc-h{font-family:var(--f-display);font-size:1rem;margin:.6em 0 0;color:var(--teal)}
.novel .doc-s{font-size:.8rem;color:var(--muted);text-indent:0;line-height:1.6}
.novel .doc-img{display:block;width:100%;max-width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--line)}
.novel .doc-t{font-size:.88rem;line-height:1.6}
.novel .mk{font-weight:700;color:var(--accent-ink);margin-right:.1em}
.reread{margin-top:12px;text-align:left;font-size:.95rem;font-weight:400;font-family:var(--f-body);border-top:1px solid var(--line);padding-top:10px}
.reread summary{cursor:pointer;color:var(--teal);font-weight:700;font-size:.9rem}
.reread .novel{margin-top:10px;max-height:50vh;overflow:auto;padding-right:6px}

.bottle{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}

車輪がレールの継ぎ目を通る音だけが続いた。", "「悠真は、これからどうするの？」直樹が尋ねた。僕は窓に映る自分の顔を見た。「高卒認定、受けようと思ってる」「そうなんだ」「まだ勉強始めたばっかりだけど」「いいじゃん」その言葉を聞いた瞬間、僕は少し身構えた。また「いいな」だ。彼はいつも、僕の話を簡単に肯定する。けれど、僕がどれだけ迷ってその決断をしたか、知っているわけではない。", "「簡単に言うなよ」声が思ったより低くなった。直樹は驚いたようにこちらを向いた。「何が？」「いいじゃんって。そんな簡単なことじゃないんだよ」言い終えてから、後悔した。直樹はしばらく黙っていた。「……そうだよな」彼は小さくうなずいた。「ごめん。簡単なことじゃないよな」僕は返事ができなかった。", "「でも、俺は本当にいいと思ったんだ。悠真が自分で決めたことだから」直樹はそう言って、鞄の持ち手を握り直した。「俺、自分で決めるのが苦手なんだよ。大学だって、先生に勧められたところを受けたし。だから、悠真が自分で次のことを考えてるの、すごいと思った」③僕は膝の上で握っていた手を、ゆっくりと開いた。", "直樹は僕を励ますために言っているのだと思っていた。学校を辞めた僕を、気の毒に感じているのだと。けれど、そうではなかったのかもしれない。僕が彼の大学生活を、ただ羨ましいものとして見ていたように、彼もまた、僕の知らないところで迷っていたのだ。", "列車は大きな駅に近づいていた。向かい側の線路には、特急列車が停車している。僕たちの乗る普通列車がホームに入ると、特急は先に発車していった。「抜かされたな」直樹が言った。「そうだね」「でも、着くところには着くんだよな」僕は少し考えた。「うん。でも、同じところに行くとは限らないけど」「確かに」直樹は笑った。④僕も笑った。さっきまで胸の奥にあった石が、少しだけ軽くなった気がした。", "列車はしばらく停車していた。ホームには急ぎ足で階段を上る人もいれば、ベンチに座って飲み物を飲む人もいた。僕はそれまで、止まっている時間は無駄なのだと思っていた。学校を辞めてからの一年半を、何も進んでいない時間だと考えていた。けれど、その間に僕は働くことを覚えた。知らない人と話せるようになった。本を読む時間が増え、自分が何を学びたいのか、少しずつ考えるようにもなった。それらは大学の単位にも、卒業証書にもならない。それでも、なかったことにはできない時間だった。", "「次、俺降りるわ」直樹が立ち上がった。「また連絡する」「うん」「同窓会、気が向いたら来いよ」「考えとく」直樹は軽く手を振って降りていった。扉が閉まる直前、彼が振り返ったので、僕も手を上げた。列車が動き出す。窓の外で、直樹の姿がゆっくりと遠ざかっていった。", "僕は鞄から、買ったばかりの問題集を取り出した。表紙の角が少し折れていたので、指で丁寧に伸ばした。最初のページを開く。知らない言葉がいくつも並んでいる。すぐには解けそうになかった。それでも、僕は鉛筆を取り出した。⑤列車は次の駅に向かって、ゆっくりと速度を上げていった。"];

/* 論説『科学との向き合い方』（問4は傍線のない一文、問6は「適当でないもの」をえらぶ問題） */
const RK_TEXT = ["天気予報で降水確率が八十パーセントと伝えられた朝、私たちは傘を持って出かけるだろう。しかし、夕方まで一滴の雨も降らなかったとしたら、どう思うだろうか。「予報が外れた」と不満を抱く人もいるかもしれない。けれども、降水確率が八十パーセントであるということは、雨が降らない可能性も残されているということである。予報が示していたのは、未来についての絶対的な答えではなく、その時点で得られた情報に基づく見通しだったのだ。", "科学について考えるとき、私たちはしばしば、科学とは物事の正しい答えを明らかにする営みだと捉えている。確かに、科学は自然界のさまざまな現象を説明し、私たちの生活を大きく変えてきた。病気の原因を探り、宇宙の成り立ちを調べ、目には見えない微小な物質の性質を明らかにする。その成果によって、かつて不可能だと思われていたことが実現してきた。", "しかし、科学の歴史を振り返ると、ある時代に正しいと考えられていた説明が、後の研究によって修正された例は少なくない。かつて人々は、地球が宇宙の中心にあり、太陽や星々がその周囲を回っていると考えていた。日常の観察では、太陽が東から昇り、西へ沈んでいくように見える。その経験に照らせば、地球が動いているという考えのほうが、むしろ不自然に感じられただろう。", "ところが、天体の観測が積み重ねられ、運動を説明する理論が発展するにつれて、地球も太陽の周囲を回る惑星の一つであることが明らかになっていった。人々が直接見ている世界そのものが変わったわけではない。変わったのは、その世界を理解するための説明の仕方である。", "このような歴史を知ると、科学の説明はいつか覆されるのだから、信用することはできないと考える人がいるかもしれない。しかし、それは科学の性質を十分に理解した考え方とはいえない。むしろ、①科学が自らの説明を修正できるということは、科学の弱点であると同時に、その大きな強みでもある。", "科学における説明は、単なる思いつきや個人の信念とは異なる。観察や実験によって得られた証拠を基に組み立てられ、他の人々によっても検討される。新しい証拠が示されれば、それまでの説明が適切であったかどうかを改めて確かめることができる。科学は、ある説明を永久に守り続けることよりも、現実をよりよく説明できる考え方を探し続けることを重視しているのである。", "例えば、ある薬が病気の治療に有効であるかを調べる場面を考えてみよう。薬を飲んだ一人の患者の症状が改善したとしても、それだけで薬の効果が証明されたとはいえない。病気が自然に回復した可能性もあれば、薬以外の治療や生活環境の変化が影響した可能性もあるからだ。", "そこで、研究者は多くの人々を対象として、薬を使用した場合と使用しなかった場合の違いを比較する。年齢や病気の重さなど、結果に影響する条件にも注意を払う。それでも、一つの研究だけですべてが明らかになるわけではない。異なる条件で行われた研究の結果を確かめ、複数の証拠を合わせて判断する必要がある。", "ここで重要なのは、②科学的な判断とは、不確実さを完全に取り除いてから行うものではないということである。どれほど慎重に研究を重ねても、将来起こることを一つ残らず予測することは難しい。それでも私たちは、病気の治療法を選び、災害に備え、社会の制度を考えなければならない。", "科学は、こうした判断に必要な根拠を与えてくれる。しかし、科学的な根拠が存在することと、それによって社会の選択が自動的に決まることとは、同じではない。", "例えば、ある感染症の流行を抑えるために、人々の移動を制限する方法が有効だとする研究結果が示されたとしよう。その結果は、対策を考えるうえで重要な情報となる。だが、移動の制限によって仕事を失う人や、学校に通えなくなる子どもが生じるかもしれない。感染を防ぐことと、生活や教育の機会を守ることの間で、どのような選択をするべきか。その問いに対して、科学だけが唯一の答えを与えるわけではない。", "科学が明らかにしようとするのは、主として「何が起こるのか」「どのような条件で起こるのか」という問いである。一方、社会の中で何を大切にし、どのような負担を引き受けるべきかという問いには、人々の価値観や倫理的な判断が関わってくる。", "もちろん、科学と価値観を完全に切り離せるわけではない。何を研究課題とするか、どのような危険を重視するかという段階にも、人間の判断が入り込む。それでも、証拠によって確かめられる事実についての問いと、何を望ましいと考えるかという問いを区別することには意味がある。両者を混同すれば、個人の好みを科学的事実であるかのように語ったり、反対に、十分な証拠がある事実を単なる意見として退けたりすることになりかねない。", "では、科学の専門家ではない私たちは、科学とどのように向き合えばよいのだろうか。", "現代では、インターネットを通じて膨大な情報を手に入れることができる。健康によいとされる食品、環境問題への対策、新しい技術の安全性などについて、互いに異なる主張を目にする機会も多い。そのようなとき、「専門家が言っているから正しい」と考える人もいれば、「専門家の意見も変わるのだから信用できない」と考える人もいる。", "しかし、この二つの態度は、正反対に見えて、ある点では共通している。どちらも、③科学を、確実な答えを与えてくれるか、そうでなければ役に立たないかという、二つの極端な立場から捉えているのである。", "専門家の知識を尊重することと、その発言を無条件に受け入れることは異なる。また、研究結果に疑問を持つことと、十分な根拠もなく否定することも異なる。大切なのは、どのような証拠が示されているのか、その証拠からどこまでのことがいえるのか、ほかの説明の可能性は検討されているのかを考えることである。", "例えば、ある食品を食べている人に特定の病気が少ないという調査結果があったとする。この結果から、その食品が病気を防ぐと直ちに結論づけることはできない。食品をよく食べる人には、運動習慣や生活環境など、別の共通点があるかもしれないからだ。二つの事柄に関係が見られることと、一方が他方の原因であることは、必ずしも同じではない。", "こうした点を考えるには、ある程度の知識が必要である。しかし、すべての人があらゆる分野の専門家になることは不可能だ。だからこそ、自分が知らないことを認め、信頼できる情報を探し、必要に応じて考えを改める姿勢が求められる。", "ここで、科学に対する「信頼」と「疑問」は、必ずしも対立するものではないことに気づく。科学の方法を信頼しているからこそ、個々の研究結果について慎重に確かめようとすることができる。逆に、疑問を持つことが認められているからこそ、科学は新しい証拠を取り入れ、発展していくことができる。", "④科学を信頼するとは、科学が決して間違えないと信じることではない。", "科学が生み出してきた知識には、長年にわたる観察や実験によって確かめられ、非常に高い確実性を持つものもある。一方、研究が始まったばかりで、まだ十分な証拠が集まっていないものもある。それらを同じように扱うことは適切ではない。科学の説明が修正され得るということは、あらゆる説明が同じ程度に疑わしいという意味ではないのである。", "私たちに必要なのは、科学の限界を理由にその成果を退けることでも、科学の成果を理由に考えることをやめることでもない。科学によって何が明らかになり、何がまだわかっていないのかを見極め、そのうえで判断することが重要なのである。", "科学が発展すればするほど、私たちは多くのことを知るようになる。しかし同時に、それまで想像もしなかった新しい問いに出会うこともある。宇宙についての知識が増えれば、その成り立ちについてさらに深い疑問が生まれる。生命の仕組みが明らかになれば、生命をどこまで操作してよいのかという新たな問題も現れる。", "知識が増えることは、必ずしも疑問が減ることを意味しない。むしろ、⑤知ることによって、私たちは自分たちの知らなさを、以前よりもはっきりと認識できるようになるのである。", "科学との向き合い方を考えることは、結局のところ、私たちが不確実な世界とどのように付き合うかを考えることでもある。完全な答えが得られるまで判断を先延ばしにすることはできない。しかし、いったん下した判断を、いつまでも変えてはならない理由もない。", "その時点で最も確かな根拠に基づいて考え、行動し、新たな事実が明らかになれば、必要に応じて考え直す。その繰り返しこそが、科学から私たちが学ぶことのできる、最も大切な姿勢なのではないだろうか。"];

const AI_TEXT = ["授業で調べ学習をするとき、以前なら図書館の本を探し、複数のウェブページを読み比べていた。ところが今では、人工知能（AI）に質問を入力すると、数秒後には整った文章が返ってくる。問いの立て方によっては、理由や具体例まで示される。こうした道具を前にして、「自分で考える必要はなくなるのではないか」と感じる人がいても不思議ではない。", "確かに、私たちは日常の多くの場面で、考える負担を道具に任せてきた。計算機があれば複雑な計算を素早く行えるし、地図アプリを使えば初めて訪れる場所でも道順を調べられる。そのたびに、私たちは以前と同じ作業を自力で行う必要から解放されてきた。AIもまた、その延長線上にある技術だといえる。", "しかし、計算の手順を機械に任せることと、何を計算するべきかを決めることは同じではない。最短経路を示す地図アプリも、寄り道して景色を楽しみたい人にとって、最善の道を必ず示すとは限らない。目的が異なれば、望ましい答えも異なるからだ。道具が優れた答えを示すほど、①「何を問い、何のためにその答えを使うのか」という判断の重要性は、むしろ増していく。", "AIの出力には、もう一つ注意すべき特徴がある。それは、文章が自然であることと、内容が正確であることが一致するとは限らない点だ。もっともらしい説明の中に、存在しない資料名や誤った数字が含まれる場合がある。読みやすく自信に満ちた文章ほど、私たちはその内容まで確かだと思い込みやすい。だが、表現の滑らかさは、事実を裏づける証拠にはならない。", "例えば、地域の川の水質について発表する生徒が、AIに「この川が汚れた原因を説明して」と尋ねたとしよう。AIが工場排水を原因として挙げたとしても、その川で実際に排水が確認されたのか、いつの調査に基づくのかを確かめなければならない。川の水質には生活排水や降雨など複数の要因が関わり得る。最初に得た説明だけを採用すれば、調査の出発点にあった疑問を、いつの間にか結論へとすり替えてしまう。", "だからといって、AIの答えをすべて疑って捨てることが賢明なのではない。AIが示した原因の候補を手がかりに、公的な観測記録を探し、異なる資料と比較することもできる。自分では思いつかなかった観点を知ることで、調査の幅が広がる場合もある。重要なのは、②「答えを受け取ること」と「答えを引き受けること」を区別する姿勢である。", "前者は、提示された情報を手に入れる行為である。後者は、その情報をどの程度信頼できるか検討し、自分の判断として使うことに責任を持つ行為だ。AIに文章を作らせたとしても、それを発表し、他者に伝えるのが自分であるなら、根拠を尋ねられたときに説明できなければならない。道具を使ったという事実は、判断の責任を道具に移す理由にはならない。", "ここで「考える力」とは何かを改めて考えてみたい。私たちは考える力を、難しい問題に正解する能力として理解しがちである。もちろん、知識を用いて筋道立てて答えを導くことは大切だ。しかし、現実の問題には、そもそも何を問題とするかが定まっていないものも多い。地域の交通を便利にするという課題一つをとっても、通勤時間を短くしたい人と、高齢者の移動手段を確保したい人では、重視する点が違う。", "もしAIに「最も効率的な交通計画を作って」と頼めば、何らかの案は示されるだろう。しかし、その「効率」は誰にとっての効率なのだろうか。利用者数の多さか、費用の少なさか、それとも移動に困る人を減らすことか。数値で比較できる項目を増やしても、何を大切にするかという問いが自動的に解決するわけではない。③答えを求める前に、問いの背後にある前提を見直す必要がある。", "このことは、AIが人間の思考を奪うという単純な見方にも修正を迫る。確かに、何も確かめず出力を写すだけなら、考える機会は減るだろう。一方で、複数の案を比較させ、その違いが生まれた条件を尋ね、自分の考えの弱点を探すために使うなら、AIは思考を広げる相手にもなり得る。同じ道具であっても、使い方によって学びの質は変わる。", "ある生徒が作文の課題に取り組む場面を想像してみよう。最初からAIに完成文を書かせて提出すれば、整った文章は得られるかもしれない。しかし、自分がなぜその主張を選んだのか、反対意見にどう応じるのかを考える機会は少ない。反対に、自分で書いた文章をAIに読ませ、論理の飛躍や別の立場からの疑問を挙げてもらうなら、書き直す過程で自分の考えが明確になることがある。", "もちろん、AIを使わなければ深く考えられないわけではない。人との対話や読書、失敗を伴う経験にも、思考を育てる力がある。AIだけを特別視する必要はない。ただ、すぐに整った答えが現れる環境では、④答えにたどり着くまでの迷いや立ち止まりを、無意味な時間だとみなしてしまう危険がある。", "考えがまとまらないとき、私たちはしばしば不快さを覚える。何がわからないのかさえ、はっきりしないこともある。だが、その状態で資料を読み直したり、他者に説明しようとしたりするうちに、初めの問いが適切でなかったことに気づく場合がある。迷いは、単に答えへ至るまでの障害ではない。自分の思い込みを発見するための時間にもなるのである。", "また、AIの利用をめぐっては、個人の努力だけでは解決できない問題もある。学習に使える機器や通信環境には差があり、出力の誤りを見抜くための知識にも差がある。さらに、入力した情報の扱いや、文章・画像の作成に関わる権利など、社会全体で考えるべき課題も残る。便利だから使えばよい、危険だから禁止すればよいという二者択一では、こうした問題を十分に扱えない。", "必要なのは、道具の能力を正しく理解するとともに、その利用をどのような条件で認め、どんな配慮を求めるかを話し合うことだろう。技術が可能にすることと、私たちが望ましいと判断することは、必ずしも一致しない。だからこそ、技術の発展に合わせて、判断の基準も問い直し続ける必要がある。", "AI時代に求められる考える力は、機械より速く答えを出す力だけではない。与えられた答えの根拠を確かめ、問いの立て方を吟味し、異なる立場の人々に目を向ける力である。そして、必要なら最初の考えを修正する力でもある。⑤「自分で考える」とは、何も借りずに一人で答えを作ることではない。", "道具や他者の知恵を借りながらも、何を大切にし、なぜその結論を選ぶのかを自分の言葉で説明できること。そのために、ときには便利な答えから距離を取り、問いそのものを考え直すこと。AIが多くの答えを示せる時代だからこそ、私たちは答えの速さだけでなく、問い続けることの価値を見失わずにいたい。"];
const AI_Q = [{"q": "傍線部①の説明として最も適当なものを選べ。", "c": ["道具の性能が高まるほど、利用者は道具の仕組みを詳しく理解しなければ答えを得られなくなるということ。", "道具が多様な答えを示せるようになるほど、利用者が目的を定め、その答えをどう使うか判断する必要が高まるということ。", "道具の答えが正確になるほど、人間が独自の目的を持つことは難しくなり、機械の提案に従うべきだということ。", "道具によって作業時間が短くなるほど、利用者は答えの正しさを検証する時間を省略できるということ。", "道具が最短の方法を示すときには、個人の希望よりも共通の効率を優先すべきだということ。"], "a": 1, "ex": "地図アプリの例では「最短」と「最善」が一致しない場合が示される。目的を設定し、答えの利用を判断する役割は人間に残る。①が正答ではないのは、道具の内部構造の理解を要求しているわけではないため。"}, {"q": "傍線部②「答えを受け取ること」と「答えを引き受けること」の違いとして最も適当なものを選べ。", "c": ["前者は情報を得ること、後者は根拠や限界を吟味したうえで自分の判断として用いる責任を負うことである。", "前者は専門家から学ぶこと、後者は専門家の意見を使わずに独力で結論を出すことである。", "前者はAIが作った文章を読むこと、後者はAIの文章を自分の表現に書き換えることである。", "前者は短時間で答えを得ること、後者は時間をかけて多くの情報を暗記することである。", "前者は誤りを含む情報を扱うこと、後者は必ず正しいと証明された情報だけを扱うことである。"], "a": 0, "ex": "本文は、情報の入手と、その情報を検討して自分の判断として使うことを区別する。言い換えや暗記だけでは「引き受ける」ことにならない。"}, {"q": "傍線部③について、交通計画の例を用いた理由として最も適当なものを選べ。", "c": ["交通計画のような問題では数値による比較が不可能なので、AIの計算能力は役に立たないことを示すため。", "利用者数が最も多い交通手段を選べば、立場の異なる人々の希望を公平に満たせることを示すため。", "AIの提案は必ず特定の人々に不利益をもたらすので、人間だけで計画を作る必要があることを示すため。", "何を効率とみなすかは重視する価値によって変わるため、答えを求める前に問いの条件を検討する必要があることを示すため。", "交通に関する課題は他の社会問題よりも複雑であり、問いを定めることが原理的にできないと示すため。"], "a": 3, "ex": "通勤時間、費用、移動困難者への配慮など、評価基準は一つではない。筆者は計算を否定せず、計算に先立つ価値判断を問題にしている。"}, {"q": "傍線部④「迷いや立ち止まりを、無意味な時間だとみなしてしまう危険がある」と筆者が述べる理由として最も適当なものを選べ。", "c": ["迷う時間が長いほど、どのような課題でも最終的に正しい答えへ到達できるから。", "AIを使うと必ず思考力が低下し、対話や読書による学習が不可能になるから。", "考えが定まらない過程で、初めの問いの問題点や自分の思い込みに気づく場合があるから。", "答えを早く得ることには教育上の価値がなく、すべての課題は時間をかけて解くべきだから。", "迷いを経験すること自体が学習の目的であり、最終的な判断を下す必要はないから。"], "a": 2, "ex": "直後の段落に、資料の再読や他者への説明を通じて初めの問いを見直す例がある。迷いには思考を深める働きがある。"}, {"q": "次の意見交換の空欄Ａに入る発言として最も適当なものを選べ。\n【意見交換】\n山田さん「AIに作文を作ってもらうことと、AIを使って作文を学ぶことは同じなのかな。」\n小林さん「本文では、同じ道具でも使い方によって学びの質が変わるとあるね。」\n山田さん「では、学びにつながる使い方って、どんなものだろう。」\n小林さん「Ａ」\n山田さん「なるほど。AIの意見を参考にしながら、自分の考えを確かめ直すんだね。」", "c": ["AIが書いた完成文をそのまま提出し、誤りが見つかった場合だけ自分で修正すればよいと思う。", "AIの表現を覚えて同じ文章を書けるようにすれば、自分の意見を考える時間は必要ないと思う。", "AIの利用は思考を妨げるので、作文に関する質問を一切しないことが最も効果的だと思う。", "AIが示す主張を正解として受け入れ、その理由を自分の文章に付け加えればよいと思う。", "まず自分の主張を書き、AIに反論や論理の弱点を挙げてもらい、それを検討して書き直すとよいと思う。"], "a": 4, "ex": "本文の作文例と対応する。AIを批判的な対話相手として利用し、最後は自分で判断・修正する点が重要。"}, {"q": "本文全体の主張を踏まえた行動として、最も適当でないものを選べ。", "c": ["AIが示した統計を発表に使う前に、出典と調査条件を確かめる。", "AIの提案を比較するとき、誰の利益や不利益が考慮されているか検討する。", "AIが作成した答えは自然な文章であるほど信頼できるので、資料の確認を省いて採用する。", "自分の文章についてAIに別の見方を求め、その指摘を自分で吟味する。", "AIの利用条件について、便利さだけでなく情報の扱いや公平性も話し合う。"], "a": 2, "ex": "本文は、文章の自然さと内容の正確さは一致しないと明示している。③は検証を省いており、筆者の立場と反する。"}];
/* 論説『音楽はなぜ人の心を動かすのか』（問6は「適当でないもの」をえらぶ問題） */
const MU_TEXT = ["駅のホームで、どこからともなく聞こえてきた旋律に足を止めたことはないだろうか。曲名も演奏者も知らないのに、なぜか胸が締めつけられる。あるいは、幼いころに聞いた歌を耳にした途端、忘れていた教室の景色や友人の声がよみがえることもある。音楽は目に見えず、手で触れることもできない。それなのに、私たちの感情や記憶に深く入り込んでくる。音楽はなぜ人の心を動かすのだろうか。", "音を物理的な現象として見れば、それは空気などを伝わる振動である。振動の速さは音の高さに、振動の大きさは音の強さに関係する。楽器によって音色が異なるのは、振動の仕方や含まれる成分が異なるためだ。音楽もまた、こうした音が時間の中に並んだものと説明できる。しかし、この説明だけでは、同じ旋律を聞いて涙を流す人と、何も感じない人がいる理由を十分に説明できない。", "私たちは音を単に受け取っているのではない。聞こえてきた音を、それまでの経験や予想と結びつけながら理解している。例えば、ある旋律が繰り返されたあと、次に来るはずの音が来なければ、私たちは小さな驚きを覚える。その意外な音が、後に続く音によって自然につながったと感じられたとき、緊張がほどけるような心地よさを覚えることがある。音楽を聞くとは、耳に届いたものを受動的に受け入れるだけでなく、①「まだ聞こえていない音を心の中で待つ」ことでもあるのだ。", "もっとも、音楽の感じ方を予想と意外性だけで説明することはできない。同じ曲であっても、楽しい出来事の記憶と結びついている人には明るく響き、つらい別れを思い出す人には悲しく響くことがある。曲そのものが変わったわけではない。音に触れる側の経験が異なるのである。音楽が心を動かす力は、音の中だけに閉じ込められているのではなく、聞く人の人生との関係の中で生まれる。", "ここで注意したいのは、感情を動かす音楽には決まった形式がある、と簡単に考えないことである。ゆっくりした曲は必ず悲しく、速い曲は必ず楽しいというわけではない。ある文化で祝祭を連想させる響きが、別の文化ではなじみのない音に聞こえることもある。音楽の受け取り方には、人間にある程度共通する面と、生活や文化によって育まれる面とが重なっている。したがって、②「音楽の意味を一つに決めてしまうこと」は、その豊かさを見失うことにつながりかねない。", "では、音楽は個人の心の中だけで働くのだろうか。祭りの太鼓に合わせて人々が歩き、合唱で互いの呼吸をそろえ、応援の歌に合わせて大勢が声を出す場面を考えてみよう。そこでは、音楽は一人ひとりの感情を動かすだけでなく、人と人との間に共通の時間をつくり出している。別々の考えを持つ人々が、同じ拍を感じ、同じ瞬間に声を重ねる。その体験によって、言葉では説明しきれない一体感が生まれることがある。", "ただし、一体感が生まれるからといって、参加者が全員同じ気持ちになるわけではない。合唱を楽しむ人もいれば、周囲に合わせることに緊張する人もいる。大きな音を心地よく感じる人がいる一方で、負担に感じる人もいるだろう。音楽が人を結びつける可能性を持つことと、誰にとっても同じように心地よいこととは別である。③「音楽の力を語るときには、その力が届く相手の違いにも目を向けなければならない」。", "音楽の価値を考えるうえで、もう一つ見落とせないことがある。それは、演奏するという行為そのものの意味である。楽器の練習では、思い描いた音がすぐに出るとは限らない。指や腕の動きを確かめ、何度も同じ箇所を繰り返し、少しずつ音の変化を聞き取っていく。昨日できなかったことが今日できるようになる喜びもあれば、練習を重ねても思うように進まない苦しさもある。", "演奏者は、楽譜に記された音符を正確に並べるだけではない。音の強さや間の取り方を選び、ほかの奏者の音を聞き、自分の音を調整する。同じ曲でも、演奏する人や場所、聞き手によって違った表情が生まれる。④「演奏とは、完成した答えを再現する作業ではなく、その場で他者や音と関係を結び直す営み」だといえるだろう。", "近年は、機械によって楽曲を生成したり、演奏を精密に再現したりする技術も発展している。こうした技術は、新しい表現を試す手段となり、これまで楽器を扱えなかった人にも創作の機会を広げるだろう。一方で、機械が正確な音を出せるなら、人間が長い時間をかけて演奏を練習する意味はなくなるのか、という問いも生まれる。", "しかし、その問いは、音楽の価値を完成した音だけに求めているのではないだろうか。友人と息を合わせようとして失敗したこと、苦手な一節をようやく弾けたこと、聴衆の反応によって演奏が思いがけず変化したこと。そうした過程には、出来上がった音だけでは測れない経験がある。技術によって音楽の作り方が変わっても、人が音を通じて試み、迷い、誰かと関わる意味まで消えるとは限らない。", "もちろん、人間の演奏だけが本物で、機械の作る音楽には価値がない、と決めつける必要もない。重要なのは、何によって音が生み出されたかだけでなく、その音と人がどのような関係を結ぶかを考えることだ。技術の進歩は、音楽とは何かという問いに終止符を打つのではなく、むしろその問いを新しい形で私たちに差し出している。", "音楽が心を動かす理由を一つの法則にまとめることは難しい。音の振動、予想と驚き、記憶、文化、人とのつながり、演奏する身体。それらが複雑に関わり合って、一つの音楽体験が形づくられる。だからこそ、ある人が涙を流した曲を別の人が理解できなかったとしても、どちらかの感じ方が間違っているとはいえない。", "⑤「音楽を理解するとは、誰もが同じ感動に到達することではない」。自分とは異なる聞こえ方や感じ方があると知り、それでも相手の経験に耳を傾けることも、音楽と向き合う一つの方法である。音楽は言葉を超えるとよくいわれる。だが、それは言葉が不要になるという意味ではない。何を感じたのかを語り合うことで、私たちは自分の耳だけでは気づかなかった音楽の側面に出会える。", "最初に触れた駅のホームの旋律に、私たちが足を止める理由は、人によって異なるだろう。それでも、その一瞬に日常の時間が少し違って感じられることがある。音楽の不思議さは、人の心を必ず同じ方向に動かすことではない。それぞれ異なる人生を生きる人に、音を通して新しい感じ方や他者との出会いを開くところにあるのではないだろうか。"];
const MU_Q = [{"q": "傍線部①「まだ聞こえていない音を心の中で待つ」とあるが、その説明として最も適当なものを選べ。", "c": ["演奏者の動きを観察することで、次に鳴る音を正確に予測すること。", "過去に聞いた曲を思い出し、実際の音を聞かずに演奏全体を再現すること。", "音の並びから次の展開を予想し、その予想と実際の音との関係を感じ取ること。", "聞こえてきた音を判断せず、音の強さや高さだけを記憶すること。", "楽譜に書かれた音を先に読み取り、演奏の誤りを見つけようとすること。"], "a": 2, "ex": "本文は、旋律の反復によって次の音を予想し、意外な展開や緊張の解消を感じる例を示す。③が最も適切。①⑤は演奏や楽譜の知識に限定しすぎ、②④も本文の説明と異なる。"}, {"q": "傍線部②「音楽の意味を一つに決めてしまうこと」が問題である理由として最も適当なものを選べ。", "c": ["音楽には音の高さや速さなどの物理的特徴が存在しないから。", "音楽の受け止め方は個人の経験や文化によって異なり、単一の意味に限定できないから。", "すべての音楽は聞く人に異なる感情を必ず生じさせるから。", "音楽の意味は作曲者だけが決められ、聞き手には判断できないから。", "音楽に共通した感じ方は一切存在せず、すべてが偶然に決まるから。"], "a": 1, "ex": "本文は人間に共通する面と経験・文化による違いの双方を認めている。②が正しい。⑤のように共通性を全面否定していない。"}, {"q": "傍線部③「音楽の力を語るときには、その力が届く相手の違いにも目を向けなければならない」とあるが、筆者の考えに最も近いものを選べ。", "c": ["音楽による一体感を高めるためには、参加者が同じ感情を持つよう指導すべきだ。", "音楽は人を結びつける力を持つので、音に負担を感じる人も参加を続けるべきだ。", "音楽の影響は個人差が大きいため、集団で音楽を楽しむことには意味がない。", "音楽の社会的な働きを認めながら、心地よさや負担の感じ方には個人差があることも考えるべきだ。", "音楽を聞く際の感情の違いは、練習を積み重ねれば完全になくせる。"], "a": 3, "ex": "合唱などの一体感を認めたうえで、緊張や音への負担を感じる人もいると述べる。④が正答。"}, {"q": "傍線部④「演奏とは、完成した答えを再現する作業ではなく、その場で他者や音と関係を結び直す営み」とあるが、その意味として最も適当なものを選べ。", "c": ["演奏者は楽譜を守らず、毎回すべての音を自由に変更する必要があること。", "演奏の価値は完成した音だけで決まるため、練習の経験は重要ではないこと。", "正確な演奏を目指すよりも、聴衆の好みに合わせて曲を変更することが大切だということ。", "演奏は個人の感情を表すだけの行為であり、他の奏者との関係は重要ではないこと。", "演奏者が周囲の音や状況に応じて表現を選び、演奏のたびに音楽を形づくること。"], "a": 4, "ex": "音量や間を選び、ほかの奏者の音を聞きながら調整するという直前の記述が根拠。⑤が正答。"}, {"q": "次の意見交換の空欄Ａに入る発言として最も適当なものを選べ。\n【意見交換】\n山田さん「機械が正確に演奏できるなら、人間が練習する意味はなくなるのかな。」\n中村さん「筆者はそう考えていないようだね。」\n山田さん「それはどうして？」\n中村さん「Ａ」\n山田さん「なるほど。出来上がった音だけで価値を判断してはいけないんだね。」", "c": ["機械が生み出す音には音楽としての価値がないからだよ。", "人間の演奏は必ず機械より正確で、聞き手を感動させるからだよ。", "練習や他者との協働の過程にも、完成した音だけでは測れない経験があるからだよ。", "演奏技術は音楽を聞く人の感情とは無関係だからだよ。", "音楽は技術の進歩とは関係なく、昔と同じ方法で演奏されるべきだからだよ。"], "a": 2, "ex": "本文では失敗、練習、聴衆との相互作用などの過程に意味があると論じる。③が適切。機械の音楽を否定していない点にも注意。"}, {"q": "本文全体の主張を踏まえた具体例として、最も適当でないものを選べ。", "c": ["同じ曲を聞いた友人が自分と異なる感想を持っていても、その理由を聞いてみる。", "合唱の練習では全員の音量や感じ方が同じになるよう求め、音が負担な人の事情は考慮しない。", "音楽を鑑賞するとき、旋律の展開に対する自分の予想や驚きに注目する。", "演奏の完成度だけでなく、仲間と音を合わせるまでの経験も大切にする。", "機械が作った音楽についても、人がそれをどう受け止めるかという観点から考える。"], "a": 1, "ex": "②は個人差や音への負担を尊重するという筆者の主張に反する。他の選択肢は本文の考えと一致する。"}];
/* 会話文『多数決は本当に公平か』（①②は発言の番号。傍線部はＡ・Ｂ・Ｃ） */
const MJ_TEXT = ["文化祭まで一か月。二年三組では、クラス企画として「謎解き教室」と「地域の昔の遊び体験」の二案が残っている。前日の学級会では二十八人中、謎解き教室に十八票、昔の遊び体験に十票が集まった。しかし、準備の担当を決める段階で話合いが止まってしまった。放課後、実行委員の四人が教室に残り、もう一度相談することになった。", "佐伯①　昨日の投票では謎解き教室が多かった。もう決定でいいんじゃないかな。いつまでも話していたら準備が間に合わないよ。", "村上①　でも、昔の遊びを提案した人たちは、地域のお年寄りに教えてもらう約束まで考えていたんだよね。投票で負けたから全部なかったことにするのは、少し気になる。", "高橋①　私は謎解きに投票したけれど、準備の係にはまだ名前を書いていない。面白そうだと思ったのと、自分が作れるかどうかは別だから。", "西野①　つまり十八票あったことと、十八人が準備に協力できることは同じじゃないんだね。まず何が決まっていて、何が決まっていないのかを整理しよう。", "佐伯②　だけど多数決をやり直したら、最初に投票した意味がなくならない？　全員が納得するまで待つのは無理だよ。", "村上②　全員が同じ案を好きになる必要はないと思う。決め方が納得できるかどうかと、決まった案が自分の第一希望かどうかは違うでしょう。", "高橋②　それなら、昨日の投票を無効にするのではなく、なぜ昔の遊びを選んだ人がいるのか聞いてみたい。私はその理由をほとんど知らずに投票したから。", "西野②　二つの案の紹介に使った時間も違ったね。謎解きは実演まであったけれど、昔の遊びは説明が短かった。票数ははっきりしている。でも、その数字だけで話合いが十分だったとは言えないかもしれない。", "佐伯③　じゃあ多数決は公平じゃないってこと？　同じ一票を持っていたのに。", "西野③　一人一票という意味では公平だよ。ただ、【Ａ　同じ条件で票を投じたことと、判断に必要な情報が十分に共有されていたことは別だ】と思う。", "村上③　昔の遊びの案には、地域の人と交流できるという良さがある。一方で、協力してくれる人の日程を確かめないと実現できない。良さも難しさも、両方伝えるべきだね。", "高橋③　謎解きも同じ。問題を考えるのが好きな人はいるけれど、教室の飾りつけや当日の案内は誰がするのか、まだ決まっていない。人気があるから準備も簡単だと思い込んでいた。", "佐伯④　なるほど。どちらの案にも、投票のときには見えていなかったことがあるんだね。でも、話を聞き直しても意見が分かれたら、結局は多数決になるよ。", "村上④　それでいい場合もあると思う。ただ、【Ｂ　多数決は話合いを終わらせる道具にはなっても、話合いの代わりにはならない】んじゃないかな。", "西野④　たとえば、目的を先に確認するのはどう？　私たちは「来場者に楽しんでもらうこと」と「クラス全員が何らかの形で参加できること」を大事にしていたよね。", "高橋④　その目的なら、二案を完全に対立させなくてもいいかも。謎解きの問題の一部に、昔の遊びを体験して答える仕組みを入れられないかな。", "佐伯⑤　面白いけど、全部を取り入れようとして中途半端にならない？　地域の人に来てもらうなら、時間や場所の調整も必要だ。", "高橋⑤　そうだね。組み合わせること自体を目標にするのは違う。実現できるか確かめてから考えるべきだね。", "村上⑤　それに、少数意見を尊重するというのは、必ずその案を採用することではないと思う。どんな価値を大切にしていたのかを、決定の中で検討することじゃないかな。", "西野⑤　では明日の学級会では、まず各案の目的、必要な人数、準備期間、協力先を同じ形式で示そう。それから質問の時間を設けて、二案と組合せ案を比較する。", "佐伯⑥　そのあと、担当できる仕事を一人ずつ確認するんだね。もし組合せ案が難しければ、無理に残さず、理由を説明して候補から外す。", "高橋⑥　そして最後に投票する。昨日の結果を隠す必要はないけれど、新しい情報を聞いて考えが変わる人がいてもいい。", "村上⑥　決まったあとも、反対した人が何を心配していたかは記録しておきたい。準備中に同じ問題が出てくるかもしれないから。", "佐伯⑦　最初は、票数が決まったら話は終わりだと思っていた。でも【Ｃ　決めることを急ぐのと、決めたことを実現できるようにするのは、必ずしも同じじゃない】んだね。", "西野⑥　うん。多数決は必要な方法の一つだけど、それを使う前と後にも、私たちが考えるべきことがあるんだと思う。"];
const MJ_Q = [{"q": "西野①の発言の意図として最も適当なものを選べ。", "c": ["昨日の投票数に誤りがないかを調べ、再集計する必要があると伝えている。", "投票による支持と実際の準備への参加を区別し、課題を整理しようとしている。", "多数派の生徒には準備の義務があることを確認しようとしている。", "準備に参加できない生徒の投票権を制限すべきだと提案している。", "企画の内容よりも準備の速さを最優先にすべきだと述べている。"], "a": 1, "ex": "【正解の根拠】西野①は「十八票あったこと」と「十八人が準備に協力できること」を区別している。投票結果だけでは実行体制が決まらないという指摘である。\n【誤答の検討】1は再集計の話ではない。3・4は投票者に義務や制限を課していない。5は準備の速さだけを優先していない。"}, {"q": "傍線部Ａについて、西野の考えを最も適切に説明したものを選べ。", "c": ["一人一票の原則が守られていれば、情報の差は結果に影響しない。", "説明時間が異なる投票は必ず無効とし、投票を禁止すべきである。", "票の重みが等しくても、判断材料の共有が不十分なら決定の過程を検討する余地がある。", "少数派の情報が多いほど、その意見を優先して採用しなければならない。", "投票の公平さは結果が全員一致になるかどうかで決まる。"], "a": 2, "ex": "【正解の根拠】西野③は一人一票という形式上の公平さを認めつつ、案の説明時間や判断材料に差があった点を問題にしている。\n【誤答の検討】1は情報の差を無視している。2は必ず無効とまでは述べていない。4は少数派の優先を主張していない。5は全員一致を条件にしていない。"}, {"q": "村上②と村上⑤の発言に共通する考えとして最も適当なものを選べ。", "c": ["全員が同じ案を支持するまで決定を延期すべきである。", "少数派の案は必ず企画の一部に採用すべきである。", "決定への納得や少数意見の尊重は、希望した案の採用だけを意味しない。", "多数決は意見の違いを解消できないので使うべきではない。", "一度決定した案については反対意見を聞く必要がない。"], "a": 2, "ex": "【正解の根拠】村上②は「決め方への納得」と「自分の第一希望」を区別し、村上⑤は「尊重」と「必ず採用すること」を区別している。どちらも結果と手続・配慮を混同しない立場である。\n【誤答の検討】1は全員一致を求めていない。2は採用を義務づけていない。4は多数決自体を否定していない。5は決定後の懸念の記録と矛盾する。"}, {"q": "傍線部Ｂの意味を、話合い全体に即して説明したものとして最も適当なものを選べ。", "c": ["多数決は議論の時間を短縮するために、最初に必ず行うべきである。", "多数決で結論を出すことがあっても、その前に情報や判断基準を検討する過程が欠かせない。", "話合いを十分に行えば必ず全員が同じ意見になり、多数決は不要になる。", "少数意見を尊重するためには、最多得票の案を選ばないことが必要である。", "多数決の結果は、準備の途中で必ず変更しなければならない。"], "a": 1, "ex": "【正解の根拠】村上④は多数決を否定せず、投票だけで十分な議論をしたことにはならないと述べる。各案の情報共有や目的の確認がその具体例である。\n【誤答の検討】1は「最初に必ず」とは言っていない。3は全員一致を前提とする。4は多数派を退けることと尊重を混同している。5は必ず変更するとは述べていない。"}, {"q": "高橋④の提案に対する、その後の話合いの捉え方として最も適当なものを選べ。", "c": ["組合せ案なら全員の希望を完全に満たせるので、直ちに採用することになった。", "組合せ案は独創性に欠けるため、検討せずに候補から外すことになった。", "組合せ案を新たな候補としつつ、目的や実現可能性を確かめて比較することになった。", "組合せ案に反対する生徒には、企画への参加を認めないことになった。", "組合せ案を採用するため、地域の協力者の都合は考慮しないことになった。"], "a": 2, "ex": "【正解の根拠】高橋④が組合せ案を提案した後、佐伯⑤が調整上の難しさを指摘し、高橋⑤も実現可能性の確認を認める。西野⑤・佐伯⑥は三案を比較し、無理なら候補から外す方針を示した。\n【誤答の検討】1は即時採用ではない。2は検討することになっている。4は参加制限の話ではない。5は協力者との調整を重視している。"}, {"q": "傍線部Ｃを踏まえ、話合い全体の結論として最も適当なものを選べ。", "c": ["決定を早めることが最も公平であり、反対意見を聞く必要はない。", "公平な決定には多数決を避け、必ず全員一致を目指す必要がある。", "多数決の票数だけでなく、情報共有、実現可能性、決定後の配慮も重要である。", "少数派の意見は準備を遅らせるため、投票前に整理して除外すべきである。", "企画の成功は投票の方法で決まるため、準備体制の検討は後回しでよい。"], "a": 2, "ex": "【正解の根拠】佐伯⑦は早く決めることと実行できる決定をすることの違いに気づいた。西野⑥のまとめと合わせると、投票の前後に必要な検討や配慮が主題である。\n【誤答の検討】1・4は反対意見を軽視する。2は多数決を全面否定する。5は準備体制を軽視し、本文と逆である。"}];
/* 会話文『便利な社会は幸せな社会か』（①②は発言の番号） */
const BS_TEXT = ["総合的な探究の時間。四人の生徒は、商店街に新しくできた無人店舗について調べ、「便利な社会は幸せな社会か」という題で発表することになった。取材では、店を利用する会社員や高齢者、店主から話を聞いている。", "佐伯①　発表の最初に、無人店舗の便利さを紹介しよう。夜遅くでも買い物ができるし、会計も短時間で済む。僕が取材した会社員は「仕事帰りに寄れる店が増えて助かる」と話していたよ。", "三浦①　私も便利だと思う。でも、「便利になった」ことと「幸せになった」ことは、同じなのかな。取材したお年寄りは、以前の店で店員さんと話すのが楽しみだったそうだよ。", "佐伯②　それは人によるんじゃない？　話したい人は別の場所で話せばいい。買い物の店は、商品を買うための場所なんだから。", "野口①　でも、ある場所の役割は一つとは限らないよ。僕たちにとっては買い物の場所でも、その人にとっては外出するきっかけだったのかもしれない。", "河合①　私が聞いた店主の話も関係しそう。無人店舗にしたら人手不足でも営業を続けられる一方で、機械の操作に困るお客さんへの対応が難しくなったって。", "佐伯③　それなら操作方法をもっと分かりやすくすれば解決できるんじゃないかな。画面の文字を大きくするとか。", "河合②　もちろん改善は必要。でも、操作が分かっても、買い物の途中で誰かに相談したい人はいると思う。たとえば、商品を探すのを手伝ってほしいとか。", "三浦②　私たちは「便利」という言葉を、主に時間や手間が減ることとして使っているね。けれど、困ったときに助けてもらえる安心感も、暮らしやすさの一部だと思う。", "佐伯④　なるほど。ただ、店員がいる店でも、忙しそうで声をかけづらいことはあるよ。無人店舗だけが冷たいという言い方は、公平じゃないと思う。", "野口②　それは大事な指摘だね。店の形だけで良し悪しを決めるのは早い。僕たちの発表も、無人店舗に賛成か反対かを決めるだけでは浅くなりそうだ。", "河合③　じゃあ、便利さを測る基準を整理しない？　「買い物にかかる時間」「利用できる時間帯」「困ったときの支援」「人との交流の機会」とか。", "三浦③　それぞれの基準で、誰にとって便利なのかも考えたい。たとえば夜勤の人には営業時間が大切でも、機械に不慣れな人には支援の有無が大切かもしれない。", "佐伯⑤　でも基準を増やしすぎると、結局どちらがよい店なのか分からなくならない？　発表では、はっきりした結論が必要だよ。", "野口③　結論は一つの店を選ぶことじゃなくてもいいと思う。「何を優先すると、何が見えなくなるか」を示すのも結論になる。", "佐伯⑥　うーん。僕は便利さが増えれば、それだけ生活に余裕が生まれると考えていた。けれど、余裕が生まれた時間をどう使えるかは、また別の話なのか。", "三浦④　そうだね。時間が節約できても、行きたい場所が減ったと感じる人もいる。反対に、店員と話さずに買えるほうが気楽だという人もいるだろうし。", "河合④　私たちの取材は人数が少ないから、全員がそう感じると決めつけるのは避けたいね。意見が分かれたこと自体を紹介してはどうかな。", "野口④　そのうえで、解決策を考えてみよう。たとえば無人店舗に、必要なときだけ店員と通話できる仕組みを付ける。近くの有人店舗の情報も掲示する。", "佐伯⑦　でも、通話の仕組みを付けたら費用がかかる。店を続けられなくなったら、買い物できる場所そのものがなくなるかもしれない。", "河合⑤　だからこそ、どんな支援が必要かを利用者に聞いて、できることから試すんじゃないかな。全部を一度に実現する必要はないよ。", "三浦⑤　それに、一度決めた仕組みがずっと正しいとも限らない。利用者の声を聞いて変えていくことも大切だと思う。", "佐伯⑧　分かった。僕が言いたかったのは、便利な仕組みをなくすべきではないということなんだ。だけど、その便利さを受け取れない人がいるなら、工夫の余地があるね。", "野口⑤　じゃあ、発表の構成は、最初に無人店舗の利点、次に取材で分かった異なる感じ方、最後に改善の方向性、という順番でどう？", "河合⑥　いいね。資料には利用者の声を、賛成・反対に分けるだけでなく、どんな場面でそう感じたかも添えたい。", "三浦⑥　最後のまとめは「便利な社会が幸せな社会になるかどうかは、便利さの種類と、それを利用する人の状況によって変わる」かな。", "佐伯⑨　それに「新しい仕組みを作ったあとも、誰が困っているかを確かめ続けることが必要だ」と加えたい。便利さを増やすことを、そこで終わりにしないために。"];
const BS_Q = [{"q": "三浦①の「同じなのかな」という発言の意図として最も適当なものを選べ。", "c": ["無人店舗が広がれば、すべての人の買い物時間が長くなると指摘するため。", "買い物の効率が上がることだけでは、暮らしの満足を判断できないと問題提起するため。", "無人店舗の導入に反対する店主の考えを紹介するため。", "店員と会話することが、すべての利用者にとって最も重要だと主張するため。", "便利さを評価するには、売上高だけを調べればよいと提案するため。"], "a": 1, "ex": "【正解の根拠】三浦は「買い物の時間が短くなる」という利点を認めつつ、会話を楽しみにしていた人の例を挙げ、便利さと幸福を同一視できるか問い直している。\n【他の選択肢が適切でない理由】1は時間が長くなるとは述べていない。3は店主の反対意見ではない。4は全員に会話が必要だと断定していない。5は売上高の話ではない。"}, {"q": "佐伯④の発言が話合いの中で果たす役割として最も適当なものを選べ。", "c": ["無人店舗に対する否定的な見方が、一面的にならないよう注意を促している。", "店員のいる店舗はすべて接客に問題があると結論づけている。", "機械の操作を改善する必要はないと主張している。", "高齢者の意見には根拠がないと否定している。", "店の種類を問わず、人との交流は不要だと説明している。"], "a": 0, "ex": "【正解の根拠】佐伯は有人店舗でも声をかけづらい場合があると述べ、無人店舗だけを「冷たい」と評価する単純化を戒める。野口②もその指摘を受けている。\n【他の選択肢が適切でない理由】2は「すべて」とは言っていない。3は操作改善を否定しない。4は高齢者の意見を否定しない。5は交流不要とは主張していない。"}, {"q": "佐伯⑤に対する野口③の考えとして最も適当なものを選べ。", "c": ["発表では、調べた店の中から最も優れた一店を選ばなければならない。", "多くの基準があると混乱するため、評価の基準を一つに絞るべきだ。", "結論を出すこと自体を避け、取材した発言だけを並べればよい。", "一つの優劣を決める代わりに、判断の基準によって見えるものが変わることを示せる。", "便利さを考える際には、利用者の立場よりも店主の利益を優先すべきだ。"], "a": 3, "ex": "【正解の根拠】野口③は、優劣を一つに決める以外にも、ある価値を優先すると別の価値が見えにくくなると示すことが発表の結論になると考えている。\n【他の選択肢が適切でない理由】1は佐伯⑤の懸念に近い。2は基準を一つに限定していない。3は結論を放棄していない。5は店主の利益を最優先していない。"}, {"q": "佐伯⑥から佐伯⑧への考えの変化として最も適当なものを選べ。", "c": ["便利さによって生まれる余裕を重視する立場から、便利な仕組みを廃止すべきだという立場に変わった。", "便利さは人によって異なると理解し、仕組みを維持しながら利用しにくい人への工夫も必要だと考えるようになった。", "人との交流の価値を認めたため、買い物時間を短くすることには意味がないと考えるようになった。", "機械に不慣れな人も練習すれば必ず利用できるため、支援は不要だと考えるようになった。", "無人店舗の費用を知り、利用者への聞き取りは行わないほうがよいと考えるようになった。"], "a": 1, "ex": "【正解の根拠】佐伯⑥は時間短縮だけでは幸福を測れないと気づき、⑧では便利な仕組みを保ちながら利用できない人への配慮も必要だと認めている。\n【他の選択肢が適切でない理由】1は廃止を求めていない。3は時間短縮の意義を否定していない。4は支援不要という考えではない。5は聞き取りの否定ではない。"}, {"q": "河合④と河合⑥の発言を踏まえた資料の示し方として最も適当なものを選べ。", "c": ["少人数の取材結果を全住民の意見として割合で示し、一般的な結論とする。", "無人店舗に賛成した人の声だけを紹介し、発表の主張を明確にする。", "取材した意見を利用場面とともに示し、異なる感じ方があったことを伝える。", "取材した人の年齢だけを並べ、利用者の具体的な発言は省略する。", "意見が分かれた事実は発表を難しくするため、取材結果を使わない。"], "a": 2, "ex": "【正解の根拠】河合④は少数の聞き取りから一般化しないよう注意し、⑥では賛否だけでなく「どんな場面でそう感じたか」を添えることを提案している。\n【他の選択肢が適切でない理由】1は少数の意見を一般化している。2は一方の声だけを採用する。4は具体的な背景を消してしまう。5は意見の違いを隠している。"}, {"q": "話合い全体を踏まえた発表のまとめとして最も適当なものを選べ。", "c": ["便利さを増やす技術は、人との交流を必ず減らすため、導入を控えるべきである。", "便利な仕組みは、利用者の違いを考えず一律に導入するほど公平になる。", "店を継続するための費用が最重要なので、利用者の困りごとは後回しにしてよい。", "人との交流を望む人だけを対象に店舗を設計すれば、社会全体の幸せにつながる。", "便利さの恩恵は人や状況で異なるため、導入後も利用者の声を確かめ、改善を続けることが大切である。"], "a": 4, "ex": "【正解の根拠】話合いでは便利さを一律に評価せず、利用者ごとの状況を考え、導入後も困りごとを確認して改善を続ける方向で合意している。\n【他の選択肢が適切でない理由】1は技術の導入そのものを否定するが、話合いはそう結論づけていない。2は利用者の違いを無視している。3は困りごとを後回しにしている。4は対象を限定しすぎている。"}];
/* 資料問題『睡眠と現代社会』（資料Ⅰ文章・資料Ⅱグラフ・資料Ⅲワークシート） */
const SL_TEXT = [{"h": "【資料Ⅰ】睡眠を「個人の努力」だけで考えない"}, "夜遅くまで仕事や勉強をし、朝は決まった時刻に起きる。こうした生活を続けるうちに、睡眠は「余った時間にとるもの」になっていないだろうか。通信機器の普及によって、私たちは夜間にも連絡を取り、動画を見たり情報を集めたりできるようになった。便利さは生活の選択肢を増やした一方、眠る時刻を自分で区切ることを難しくしている。", "睡眠は、単に活動を休止する時間ではない。私たちは眠っている間にも、心身の状態を整えている。しかし、睡眠の大切さを知っていることと、実際に十分な睡眠を確保できることは同じではない。帰宅が遅い人、家事や育児を担う人、早朝から通学する人では、使える時間の条件が異なるからだ。", "厚生労働省の令和5年「国民健康・栄養調査」によれば、20歳以上で一日の平均睡眠時間が6時間未満の人の割合は、男性38.5％、女性43.6％であった。また、睡眠で休養がとれている人の割合は74.9％で、平成21年以降の調査結果と比較すると低下傾向が見られる。ここで注意したいのは、睡眠時間と休養感が同じ指標ではないという点である。前者は時間の長さについての回答であり、後者は眠った後に休養を得られたと感じているかについての回答である。", "たとえば、長く眠った日でも疲れが残ることがあるし、睡眠時間が短いことを自覚していても、休養がとれたと答える人もいるだろう。だからといって、睡眠時間を確保する必要がないという結論にはならない。複数の指標は、互いを打ち消すためではなく、生活の状態を異なる角度から確かめるために用いるべきなのである。", "さらに、調査の数値を読む際には、その数値が何を表していないかにも目を向けたい。女性のほうが6時間未満の割合が高いという結果から、女性は男性より睡眠を軽視している、と断定することはできない。仕事の時間帯、家庭での役割、健康状態など、背景にある事情をこのグラフだけから特定できないからである。数字は現状を知る手がかりだが、原因の説明まで自動的に与えてくれるわけではない。", "「早く寝ればよい」という助言は、実行できる人には役立つだろう。しかし、本人の工夫だけでは変えられない条件もある。職場の勤務時間や学校の予定、家庭内の負担の分担、夜間に連絡を求める習慣などが、眠るための時間を左右する。睡眠の問題を個人の意志の弱さとして片付ければ、こうした条件は見えにくくなる。", "もちろん、社会の仕組みが変わるのを待つだけでは十分ではない。就寝前の過ごし方を見直したり、必要な休息を予定に組み込んだりすることも大切だ。重要なのは、個人の生活改善と、休みやすい環境づくりを対立するものとして扱わないことである。両方を組み合わせて初めて、多くの人が実行できる対策に近づく。", "睡眠について考えることは、時間をどう使うかという個人の問題を考えると同時に、社会が人々の時間をどう扱っているかを問い直すことでもある。私たちは、睡眠を削って活動することだけを努力と評価するのではなく、十分に休むことも学びや仕事を支える大切な条件として捉える必要がある。", {"s": "※本文は教材用のオリジナル文章。統計数値は厚生労働省「令和5年国民健康・栄養調査」に基づく。"}, {"h": "【資料Ⅱ】統計グラフ"}, "次のグラフは、厚生労働省「令和5年国民健康・栄養調査結果の概要」の数値をもとに教材用に再作成したものである。", {"img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAJSBaADASIAAhEBAxEB/8QAHAABAQEBAQEBAQEAAAAAAAAAAAcGBQQIAwEC/8QAYBAAAQIEAgQICgQKBgYIBAcBAAECAwQFBgcREhgh0xMXMVVWo6XSCBQiQVFUZpOk4xUyN2EWIzZxdoGFs7TDQkdSdZGyJDNFYoOVOENXcoKSscFTc6HRJjR0d5aixOH/xAAZAQEAAwEBAAAAAAAAAAAAAAAAAgQFAQP/xAAmEQEAAQQABwEAAwEBAAAAAAAAAQIDFFEREhMyUpGxBD const SL_Q = [{"q": "【資料Ⅰ】で筆者が睡眠時間と休養感を区別している理由として最も適当なものを選べ。", "c": ["睡眠時間だけが健康状態を正確に示すため。", "休養感は調査によって測定できないため。", "両者は異なる側面を表し、合わせて考える必要があるため。", "休養感が高ければ睡眠時間を確保する必要がないため。", "睡眠時間と休養感は常に反対の変化を示すため。"], "a": 2, "ex": "【正答の根拠】本文は、睡眠時間を「長さ」、休養感を「眠った後の実感」と区別し、異なる角度から生活を確かめるべきだと述べる。\n【他の選択肢】①時間のみを絶対視していない。②休養感も調査されている。④睡眠時間の必要性を否定していない。⑤常に逆方向とは述べていない。"}, {"q": "【資料Ⅱ】の二つのグラフから読み取れることとして最も適当なものを選べ。", "c": ["2023年は男女とも6時間未満の人が過半数である。", "女性の6時間未満の割合は男性より5.1ポイント高い。", "睡眠で休養がとれている人は2009年から毎年減少し続けた。", "2023年に休養がとれていない人の割合は74.9％である。", "2023年の男性の平均睡眠時間は女性より5.1時間長い。"], "a": 1, "ex": "【正答の根拠】43.6－38.5＝5.1ポイントである。\n【他の選択肢】①両者とも50％未満。③「毎年」ではなく調査年ごとに増減がある。④74.9％は休養がとれている人。⑤割合の差を時間の差に置き換えている。"}, {"q": "【資料Ⅲ】の「考えたこと①」について、最も適切な評価を選べ。", "c": ["グラフの男女差から、睡眠を重視する気持ちの差が直接わかるため妥当である。", "女性の割合が高いという事実そのものが誤っている。", "2009年のデータを用いていないため、必ず誤りになる。", "睡眠時間の差から価値観の差を断定しており、資料の根拠を超えている。", "男女の割合が異なる場合、どんな考察もしてはいけない。"], "a": 3, "ex": "【正答の根拠】女性の6時間未満の割合が高いことは示されるが、睡眠を重視する意識や原因は測定されていない。\n【他の選択肢】①意識は直接わからない。②数値は正しい。③過去データの有無だけが問題ではない。⑤資料に即した慎重な考察は可能。"}, {"q": "【資料Ⅰ】の筆者の主張に最も合うものを選べ。", "c": ["睡眠の改善は本人の意志だけで達成できる。", "勤務や家庭の事情は睡眠と無関係である。", "睡眠時間を増やせば、誰もが同じ休養感を得られる。", "社会制度が変わるまでは個人でできる工夫を控えるべきだ。", "個人の工夫と、休息を取りやすい社会的条件の整備を両立させるべきだ。"], "a": 4, "ex": "【正答の根拠】本文は本人の工夫の重要性を認めつつ、勤務・家庭などの条件も改善すべきだとする。\n【他の選択肢】①②個人だけに原因を求めている。③休養感は個人差がある。④個人の工夫を否定していない。"}, {"q": "【資料Ⅰ】と【資料Ⅱ】を踏まえて、発表の結論として最も適当なものを選べ。", "c": ["睡眠の問題には複数の指標と背景事情を踏まえた検討が必要である。", "グラフが示す男女差の原因は、生活習慣だけで説明できる。", "休養感が低下したため、すべての人の睡眠時間も短くなった。", "統計に個人差がある以上、社会全体の傾向を考える意味はない。", "睡眠の問題は夜間の通信機器の使用を禁止すれば解決する。"], "a": 0, "ex": "【正答の根拠】筆者は統計の意味と限界を踏まえ、個人と社会の両面から睡眠を考える必要を説く。\n【他の選択肢】②原因は特定できない。③休養感の変化から全員の睡眠時間の変化は導けない。④統計は傾向を把握する手がかりになる。⑤単一の対策で解決するとは述べていない。"}];

const SP = ZUKAN.map((c,i)=>({ id:'k'+String(i+1).padStart(2,'0'), name:c.name, note:c.note, obj:c.obj })).filter(x=>!x.obj);
const SP_OLD = { kani:'k05', umiushi:'k11', yadokari:'k21', isogin:'k31', hitode:'k41', haze:'k61', fujitsubo:'k81', kamenote:'k88', tako:'k95', amefurashi:'k98' };
const spOf = id => SP.find(x=>x.id===id) || SP[0];
function poolInit(){
  if(!R.pool){ const n=Object.keys(R.lessons||{}).length; R.pool={ waves:n, total:n, fed:0, sp:null, born:[] }; }
  const ok=id=>SP.some(x=>x.id===id);
  R.pool.born.forEach((t,i)=>{ if(!ok(t.sp)) t.sp = SP_OLD[t.sp] || SP[(i*7+3)%SP.length].id; });
  if(!R.pool.sp || !ok(R.pool.sp)) R.pool.sp=poolNextSp(); return R.pool;
}
function poolNextSp(){ const got=new Set((R.pool&&R.pool.born||[]).map(t=>t.sp)); const rest=SP.filter(x=>!got.has(x.id)); return pick(rest.length?rest:SP).id; }
const growOf = fed => { let g=GROW[0]; for(const s of GROW) if(fed>=s.at) g=s; return g; };
function stageSVG(fed){
  const g=growOf(fed).n; let s='';
  const rock=`<path d="M0 150 Q40 120 80 132 Q120 112 160 130 Q200 118 220 140 V170 H0Z" fill="#7C8A86"/>`;
  if(g==='さざ波') s=`<path class="lap" d="M10 100 q25 -12 50 0 t50 0 50 0 50 0" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".8"/>`;
  else if(g==='潮が満ちてきた') s=`<ellipse cx="110" cy="138" rx="70" ry="14" fill="#2C8C8E"/><path class="lap" d="M10 92 q25 -12 50 0 t50 0 50 0 50 0" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".8"/>`;
  else s=`<ellipse cx="110" cy="138" rx="70" ry="14" fill="#2C8C8E"/><ellipse cx="120" cy="138" rx="16" ry="6" fill="#0F3E40" opacity=".7"/><text x="148" y="122" fill="#FFFFFF" font-size="18" font-weight="700">?</text>`;
  return `<svg class="stg" viewBox="0 0 220 170" role="img" aria-label="${g}">${rock}${s}</svg>`;
}
function tideSVG(born){
  const n=born.length; let st='';
  const show=born.slice(-24), k=n>14?.8:1;
  show.forEach((t,i)=>{ const r=seeded(i*31+7), x=40+r()*280, y=110+r()*88; st+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${k})">${art(t.sp)}</g>`; });
  return `<svg class="tide" viewBox="0 0 360 230" role="img" aria-label="潮だまり　生き物 ${n} ひき">
  <defs><linearGradient id="tw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD3D2"/><stop offset="1" stop-color="#3E9A9C"/></linearGradient></defs>
  <rect width="360" height="230" fill="#D9C9A8"/>
  <path d="M0 50Q40 26 90 40T190 34T290 30T360 46V230H0Z" fill="#8A9894"/>
  <path d="M18 86Q30 64 80 70T180 66T280 64T344 84Q352 160 330 206Q260 224 180 222T30 210Q8 160 18 86Z" fill="url(#tw)"/>
  <path class="lap" d="M44 104q20-6 40 0t40 0M204 98q20-6 40 0t40 0M96 156q20-6 40 0" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="2" fill="none" stroke-linecap="round"/>
  <g fill="#8A9894"><ellipse cx="40" cy="96" rx="22" ry="12"/><ellipse cx="322" cy="140" rx="18" ry="11"/></g>
  ${st}${n?'':`<text x="180" y="150" text-anchor="middle" fill="#0F3E40" font-size="13">まだ生き物はいません</text>`}</svg>`;
}
const WAVE_I = `<svg class="wavei" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10c2.5-3 5-3 7.5 0s5 3 7.5 0 3-2 5-1"/><path d="M2 16c2.5-3 5-3 7.5 0s5 3 7.5 0 3-2 5-1"/></svg>`;
function poolFeed(arg){
  const s=poolInit(), before=growOf(s.fed).n, n=Math.min(arg==='all'?s.waves:1, s.waves, POOL_NEED-s.fed); if(n<=0) return;
  s.waves-=n; s.fed+=n; S.born=null; S.poolMsg='';
  if(s.fed>=POOL_NEED){ s.born.push({ sp:s.sp, d:today() }); S.born=s.sp; s.fed=0; s.sp=poolNextSp(); }
  else if(growOf(s.fed).n!==before) S.poolMsg=`「${growOf(s.fed).n}」になりました！`;
  else S.poolMsg=`波を ${n} つ寄せました。`;
  save();
}

    const doc=await lib.getDocument({ data, isEvalSupported:false }).promise; if(tok!==P.tok) return; box.innerHTML='';

const VIEWS={ setup:vSetup, home:vHome, course:vCourse, subject:vSubject, unit:vUnit, lesson:vLesson, cards:vCards, quiz:vQuiz, result:vResult, record:vRecord, settings:vSettings, install:vInstall, drill:vDrill, pdf:vPdf, pool:vPool, goto:vGoto };
function render(){
  app.innerHTML=VIEWS[S.view]();

  const tabFor={record:'record',settings:'settings',pool:'pool'}[S.view]||'home';

function answerQ(picked){
  const Q=S.quiz, q=Q.qs[Q.i], ok=picked===q.answer; Q.picked=picked; R.answered++;
  if(ok){ Q.score++; R.correct++; } else Q.wrong.push(q);

}

document.addEventListener('click', e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ S.stack=[]; S.viewCard=null; S.born=null; S.poolMsg=''; S.view=tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;

  else if(a==='openReward'){ const rc=b.closest('.rcard'); if(rc) rc.classList.add('open'); b.disabled=true; }
  else if(a==='viewCard'){ S.viewCard=+arg; render(); }
  else if(a==='closeCard'){ S.viewCard=null; render(); }

  else if(a==='pdf') openPdf(arg);
  else if(a==='pdfTab'){ S.pdf.i=+arg; render(); }
  else if(a==='pdfZoom'){ S.pdf.z=S.pdf.z>1?1:1.8; render(); }
  else if(a==='course'){ S.course=arg; go('course'); }
  else if(a==='subject'){ S.subj=+arg; go('subject'); }
  else if(a==='unit'){ S.uid=arg; go('unit'); }
  else if(a==='goto'){ S.gi=+arg; go('goto'); }
  else if(a==='setupDone'){ const code=normCode(document.getElementById('su-code').value); if(!CODE_RE.test(code)){ document.getElementById('su-err').hidden=false; return; }
    R.code=code; R.name=document.getElementById('su-name').value.trim(); save(); S.stack=[]; S.view='home'; render(); }
  else if(a==='lesson'){ if(b.dataset.uid) S.uid=b.dataset.uid; S.lid=arg; go('lesson'); }
  else if(a==='lessonNext'){ const u=CU(); S.lid=arg; S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject','unit']; S.view='lesson'; render(); window.scrollTo(0,0); }
  else if(a==='quiz') startQuiz();
  else if(a==='cards'){ S.deck={cur:deckNext()}; S.flipped=false; markDay(); go('cards'); }
  else if(a==='flip'){ S.flipped=!S.flipped; render(); }
  else if(a==='cardKnown'){ const k=knownList(); if(!k.includes(S.deck.cur)) k.push(S.deck.cur); save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='cardLater'){ const left=terms().map((_,i)=>i).filter(i=>!knownList().includes(i)); S.deck.cur=left[(left.indexOf(S.deck.cur)+1)%left.length]; S.flipped=false; render(); }
  else if(a==='cardsReset'){ R.known[S.uid]=[]; save(); S.deck.cur=deckNext(); S.flipped=false; render(); }
  else if(a==='hint'){ S.quiz.hint=true; render(); }
  else if(a==='pick') answerQ(arg);
  else if(a==='next'){ const Q=S.quiz;
    if(Q.i+1<Q.qs.length){ Q.i++; Q.picked=null; Q.hint=false; render(); window.scrollTo(0,0); return; }
    S.reward=null; S.gotWave=false; S.bottle=null;
    if(!Q.retry){ poolInit(); const u=CU(), l=LX(S.lid), k=lkey(S.uid,l.id), first=!R.lessons[k], wasDone=unitDone(S.uid), n=Q.qs.length, s=R.lessons[k]||{best:0,tries:0,total:n};
      s.tries++; s.best=Math.max(s.best,Q.score); s.total=n; R.lessons[k]=s; R.lastUnit=S.uid; save();
      report({ subject:u.subject, unit:u.no+' '+u.title, lesson:l.id, title:l.t, score:Q.score, total:n, sec:Math.round((Date.now()-S.lessonStart)/1000) });
      if(!wasDone&&unitDone(S.uid)){
        const sb=courseById(u.course).subjects[u.subj], pub=sb.units.filter(x=>x.ready);

  else if(a==='retry'){ const list=S.quiz.wrong.map(q=>Object.assign({},q,{choices:shuffle([...q.choices])})); S.view=S.stack.pop()||'lesson'; startQuiz(list); }
  else if(a==='again'){ S.view=S.stack.pop()||'lesson'; startQuiz(); }
  else if(a==='feed'){ poolFeed(arg); render(); }
  else if(a==='toPool'){ S.stack=[]; S.born=null; S.poolMsg=''; S.view='pool'; render(); window.scrollTo(0,0); }
  else if(a==='tounit'){ const u=CU(); S.course=u.course; S.subj=u.subj; S.stack=['home','course','subject']; S.view='unit'; render(); window.scrollTo(0,0); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.viewCard!=null){ S.viewCard=null; render(); } });

render(); flush();
if('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body></html>
